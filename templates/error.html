{% extends "base.html" %}
{% block title %}{{ code }} - Drizzl Inventory{% endblock %}
{% block content %}
<div class="panel callout-error" style="max-width:700px; margin:40px auto 0;">
  <div class="eyebrow">Something went wrong</div><h1 style="margin:5px 0 8px;">{{ code }}</h1>
  <p class="subtitle" style="margin:0;">{{ message }}</p>
  <p style="margin:16px 0 0;"><a href="{{ url_for('dashboard') }}">&larr; Back to dashboard</a></p>
</div>
{% endblock %}
