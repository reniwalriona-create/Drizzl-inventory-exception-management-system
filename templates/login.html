{% extends "base.html" %}
{% block title %}Log in - Drizzl Inventory{% endblock %}
{% block content %}
<div class="panel" style="max-width:340px; margin:40px auto 0;">
  <div class="eyebrow">Drizzl Inventory</div><h1 style="margin:5px 0 8px;">Welcome back</h1><p class="subtitle">Log in to manage inventory and documents.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" required>
    </div>
    <button type="submit" style="width:100%;">Log in</button>
  </form>
</div>
{% endblock %}
